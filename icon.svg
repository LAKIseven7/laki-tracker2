<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <circle cx="256" cy="200" r="180" fill="url(#glow)"/>
  <!-- Chart bars representing tracking -->
  <rect x="110" y="310" width="52" height="100" rx="10" fill="url(#accent)" opacity="0.6"/>
  <rect x="182" y="260" width="52" height="150" rx="10" fill="url(#accent)" opacity="0.75"/>
  <rect x="254" y="200" width="52" height="210" rx="10" fill="url(#accent)" opacity="0.9"/>
  <rect x="326" y="240" width="52" height="170" rx="10" fill="url(#accent)" opacity="0.8"/>
  <!-- BT text -->
  <text x="256" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="900" fill="white" letter-spacing="-4">BT</text>
  <!-- Small dice icon -->
  <circle cx="400" cy="140" r="28" fill="rgba(255,255,255,0.08)" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="392" cy="132" r="4" fill="white" opacity="0.8"/>
  <circle cx="408" cy="148" r="4" fill="white" opacity="0.8"/>
  <circle cx="400" cy="140" r="4" fill="white" opacity="0.8"/>
</svg>
